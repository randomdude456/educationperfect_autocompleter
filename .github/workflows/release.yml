name: Create Release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Chrome extension ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          OUT="dist/EP-Auto-${VERSION}"
          mkdir -p "$OUT"
          cp chrome-extension/manifest.json chrome-extension/content.js "$OUT/"
          cp README.md SETUP.md CHANGELOG.md LICENSE "$OUT/"
          cd dist
          zip -r "EP-Auto-${VERSION}-Chrome.zip" "EP-Auto-${VERSION}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             "dist/EP-Auto-${GITHUB_REF_NAME}-Chrome.zip"             --title "EP Auto ${GITHUB_REF_NAME}"             --notes-file "RELEASE_NOTES_${GITHUB_REF_NAME}.md"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EP-Auto-${{ github.ref_name }}-Chrome
          path: dist/*.zip
